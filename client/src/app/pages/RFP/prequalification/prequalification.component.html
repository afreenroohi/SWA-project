<div class="col-12">
  <div class="p-2">
    <!-- Header Box -->
    <div class="rfp-header-box">
      <div class="rfp-header-content">
        <i nz-icon nzType="file-add" nzTheme="outline" class="rfp-header-icon"></i>
        <div>
          <h1 class="rfp-header-title">Prequalification</h1>
        </div>
      </div>
    </div>

    <!-- Stepper -->
    <div class="stepper-card mt-4" style="margin-left: 20px">
      <div class="custom-stepper">
        <div class="stepper-container">
          <!-- Step 1 -->
          <div
            class="step-item"
            [class.active]="currentStep === 0"
            [class.completed]="currentStep > 0"
            (click)="goToStep(0)"
          >
            <div class="step-box">
              <i nz-icon nzType="info-circle" style="font-size: 28px"></i>
            </div>
            <div class="step-title">Basic Information</div>
          </div>

          <div class="step-line" [class.completed]="currentStep > 0"></div>

          <!-- Step 2 -->
          <div
            class="step-item"
            [class.active]="currentStep === 1"
            [class.completed]="currentStep > 1"
            (click)="goToStep(1)"
          >
            <div class="step-box">
              <i nz-icon nzType="file-done" style="font-size: 28px"></i>
            </div>
            <div class="step-title">Scope of Work</div>
          </div>

          <div class="step-line" [class.completed]="currentStep > 1"></div>

          <!-- Step 3 -->
          <div
            class="step-item"
            [class.active]="currentStep === 2"
            [class.completed]="currentStep > 2"
            (click)="goToStep(2)"
          >
            <div class="step-box">
              <i nz-icon nzType="paper-clip" style="font-size: 28px"></i>
            </div>
            <div class="step-title">Attachments</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Basic Information Section -->
    <nz-collapse
      *ngIf="currentStep === 0"
      [nzExpandIconPosition]="'right'"
      class="mt-4 w-100"
      style="margin-left: 20px"
    >
      <nz-collapse-panel
        [nzActive]="true"
        nzHeader="Basic Information"
      >
        <div class="row w-100 my-2">
          <!-- Name of Qualification Call -->
          <div class="col-4 my-1">
            <nz-form-label nzRequired>Name of Qualification Call</nz-form-label>
            <input nz-input placeholder="Enter Qualification Call Name" />
          </div>

          <!-- Name of Technical Entry -->
          <div class="col-4 my-1">
            <nz-form-label nzRequired>Name of Technical Entry</nz-form-label>
            <nz-select style="width: 100%" nzPlaceHolder="Select Technical Entry">
              <nz-option nzValue="entry1" nzLabel="Technical Entry 1"></nz-option>
              <nz-option nzValue="entry2" nzLabel="Technical Entry 2"></nz-option>
              <nz-option nzValue="entry3" nzLabel="Technical Entry 3"></nz-option>
            </nz-select>
          </div>

          <!-- Qualification Committee -->
          <div class="col-4 my-1">
            <nz-form-label nzRequired>Qualification Committee</nz-form-label>
            <nz-select style="width: 100%" nzPlaceHolder="Select Committee">
              <nz-option nzValue="committee1" nzLabel="Committee 1"></nz-option>
              <nz-option nzValue="committee2" nzLabel="Committee 2"></nz-option>
              <nz-option nzValue="committee3" nzLabel="Committee 3"></nz-option>
            </nz-select>
          </div>
        </div>

        <div class="row mt-2">
          <div class="d-flex justify-content-end mt-2 actions gap-2">
            <button nz-button nzType="primary" class="btn-save-draft" nzSize="default">
              Save As Draft
            </button>
            <button nz-button nzType="primary" class="btn-save-continue" nzSize="default">
              Save & Continue
            </button>
          </div>
        </div>
      </nz-collapse-panel>
    </nz-collapse>
  </div>
</div>
