<nz-modal [(nzVisible)]="isOTPVisible" nzClassName="otp-modal" [nzContent]="nzModalContent" [nzFooter]="modalFooter" (nzOnCancel)="handleCancel()">
    <!-- <div style="display: flex; justify-content: space-between">
        <button nz-button nzType="primary" nzShape="circle" (click)="handleCancel()"><span nz-icon
                nzType="close"></span></button>
    </div> -->

    <div *nzModalTitle class="heading d-flex" style="justify-content: space-between;">
        <h3>{{ 'COM.Enter OTP 1' | translate}}</h3>
        <button class="closeIcon" (click)="handleCancel()">
            <img src="../../../../../assets/logo/CloseIcon.svg" alt="">
        </button>
      </div>
    <ng-template #nzModalContent>

        <ng-otp-input (onInputChange)="onOtpChange($event)"  style="direction: ltr;" [config]="{length:5}"></ng-otp-input>
    </ng-template>
    <ng-template #modalFooter>
        <div style="display: flex; justify-content: space-between">
            <!-- <button nz-button nzType="primary" nzType="primary" (click)="handleCancel()">{{ 'RFP.Cancel' | translate }}</button> -->

        <button nz-button nzType="primary" [disabled]="OTPvalue.length != 5" (click)="handleOk()" [nzLoading]="isConfirmLoading">{{ 'RFP.Save' | translate }}</button>
        </div>
    </ng-template>
</nz-modal>
